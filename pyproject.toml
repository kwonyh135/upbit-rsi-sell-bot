[project]
name = "huntbot"
version = "0.1.0"
description = "KRW-HUNT RSI overheat sell bot for Upbit"
requires-python = ">=3.11"
dependencies = [
  "PyJWT>=2.8",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "psutil>=5.9",
  "streamlit>=1.37",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["huntbot*"]
